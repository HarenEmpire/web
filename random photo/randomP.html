<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    

    <style>
        body { 
            background-image: url(nintendobg.jpg);
        }
        h1 {
            color: crimson;
            margin-top: 40px;
            font-size: 2rem;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;

        }

     #randomImage {
        display: block;
        margin: 100px auto;
        border-radius: 150px;
     }
     .resimler {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
  }

  .kutu {
    text-align: center;
    margin-bottom: 30px;
    width: 270px;
    height: 270px;
  }

  .kutu img {
    width: 270px;
    height: 270px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
  }

  button {
    margin-top: 10px;
    margin-bottom: 10px;
    padding: 8px 15px;
    cursor: pointer;
    background-color: green;
    color: beige;
  }

    </style>
    
</head>
<body>
<div class="text-center">

    <div>
    <h1>Random Photos :D</h1>
    </div>

    <div>
    <img id="randomImage" width="300" height="300">
    </div>
    
<div class="resimler">

<div class="kutu">
    <button onclick="document.getElementById('resim1').style.display='none'">Gizle</button>
    <button onclick="document.getElementById('resim1').style.display='block'">Göster</button>
    <img id = resim1 src="/photos/agac.png" class="resim">
  </div>

  <div class="kutu">
    <button onclick="document.getElementById('resim2').style.display='none'">Gizle</button>
    <button onclick="document.getElementById('resim2').style.display='block'">Göster</button>
    <img id = resim2 src="/photos/lotr.JPG" class="resim">
  </div>

  <div class="kutu">
    <button onclick="document.getElementById('resim3').style.display='none'">Gizle</button>
    <button onclick="document.getElementById('resim3').style.display='block'">Göster</button>
    <img id = resim3 src="/photos/mansur.JPG" class="resim">
  </div>
  </div>

</div>

</div>

    <script>
        const resimler = [
            "/photos/agac.png",
            "/photos/boys.PNG",
            "/photos/böte.jpeg",
            "/photos/gym.jpeg",
            "/photos/hakan.jpg",
            "/photos/haren1.png",
            "/photos/haren2.png",
            "/photos/haren3.png",
            "/photos/it.jpeg",
            "/photos/jason.jpeg",
            "/photos/lotr.JPG",
            "/photos/mansur.JPG",
            "/photos/uwu.jpg"
        ];
        
        const randomIndex = Math.floor(Math.random() * resimler.length);

        document.getElementById("randomImage").src = resimler[randomIndex];
        
    </script>

</body>
</html>
